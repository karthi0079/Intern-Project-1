groups:
  - name: nginx-health-alerts
    rules:
      - alert: NginxDown
        expr: probe_success{job="nginx-blackbox"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "NGINX website is unavailable"
          description: "The HTTP health check for {{ $labels.instance }} has failed for 30 seconds."
